<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Cup 2026 Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#07121c" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Heebo:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body data-view-mode="live">
  <div class="bg-orb bg-orb-one"></div>
  <div class="bg-orb bg-orb-two"></div>

  <div class="page-shell">
    <nav class="top-navbar" aria-label="Primary">
      <div class="top-navbar-brand">
        <span class="top-navbar-kicker">WC 2026</span>
      </div>
      <div class="top-navbar-links">
        <a class="top-navbar-link" href="/">Predictor</a>
        <a class="top-navbar-link" href="/high-scores">High Scores</a>
        <a class="top-navbar-link is-active" href="/admin">Admin</a>
      </div>
      <div class="top-navbar-actions">
        <button id="admin-signout-button" class="button secondary small hidden" type="button">Sign out</button>
      </div>
    </nav>

    <header class="hero admin-hero">
      <div class="hero-copy">
        <p class="eyebrow">Admin</p>
        <h1>Manage users.</h1>
        <p id="admin-status" class="panel-note">Checking auth...</p>
      </div>
      <div class="save-panel">
        <form id="admin-login-form" class="admin-login-form">
          <div class="auth-fields">
            <div class="auth-field">
              <label class="field-label" for="admin-email-input">Email</label>
              <input id="admin-email-input" class="field-input" type="email" autocomplete="email" required />
            </div>
            <div class="auth-field">
              <label class="field-label" for="admin-password-input">Password</label>
              <input id="admin-password-input" class="field-input" type="password" autocomplete="current-password" minlength="6" required />
            </div>
          </div>
          <div class="save-actions">
            <button id="admin-login-button" class="button primary" type="submit">Log in</button>
          </div>
        </form>
        <div id="admin-session-panel" class="admin-session-panel hidden">
          <p class="eyebrow">Signed in</p>
          <h2 id="admin-session-email">Admin</h2>
          <p class="panel-note">Only users with admin access can load and modify accounts.</p>
        </div>
      </div>
    </header>

    <main id="admin-content" class="page-grid hidden">
      <section class="section-block admin-create-section" aria-labelledby="admin-create-title">
        <div class="section-heading compact">
          <div>
            <p class="eyebrow">Create User</p>
            <h2 id="admin-create-title">New Account</h2>
          </div>
        </div>
        <form id="admin-create-form" class="admin-create-form">
          <div class="admin-create-grid">
            <div class="auth-field">
              <label class="field-label" for="create-display-name-input">Display name</label>
              <input id="create-display-name-input" class="field-input" type="text" maxlength="60" autocomplete="off" />
            </div>
            <div class="auth-field">
              <label class="field-label" for="create-email-input">Email</label>
              <input id="create-email-input" class="field-input" type="email" autocomplete="off" required />
            </div>
            <div class="auth-field">
              <label class="field-label" for="create-password-input">Password</label>
              <input id="create-password-input" class="field-input" type="password" minlength="6" autocomplete="new-password" required />
            </div>
            <label class="admin-check-field">
              <input id="create-admin-input" type="checkbox" />
              <span>Admin</span>
            </label>
          </div>
          <div class="save-actions">
            <button id="create-user-button" class="button primary" type="submit">Create user</button>
          </div>
        </form>
      </section>

      <section class="section-block" aria-labelledby="admin-users-title">
        <div class="admin-users-head">
          <div>
            <p class="eyebrow">Users</p>
            <h2 id="admin-users-title">Accounts</h2>
          </div>
          <button id="refresh-users-button" class="button secondary" type="button">Refresh</button>
        </div>
        <div id="admin-users-list" class="admin-users-list"></div>
      </section>
    </main>
  </div>

  <script src="/vendor/supabase/supabase.js"></script>
  <script type="module" src="/admin.js"></script>
</body>

</html>
